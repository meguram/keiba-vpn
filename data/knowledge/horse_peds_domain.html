const STORE = 'ped_edit_';
function hasEdit(id){ return localStorage.getItem(STORE+id) !== null; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

function htmlToText(html){
  return html
    .replace(/<div class="spacer"><\/div>/g,'\n')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<\/p>/gi,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/\n{3,}/g,'\n\n').trim();
}

function textToHtml(text){
  if(!text||!text.trim()) return '<p class="empty">（記載なし）</p>';
  return text.split('\n').map(line=>{
    const t=line.trim();
    if(!t) return '<div class="spacer"></div>';
    const e=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(/^【.+】/.test(t)) return '<p class="label">'+e+'</p>';
    if(/^[❶❷❸❹❺❻❼❽❾]/.test(t)) return '<p class="num">'+e+'</p>';
    if(t.startsWith('★')) return '<p class="star">'+e+'</p>';
    if(t.startsWith('・')||/^- /.test(t)) return '<p class="bullet">'+e+'</p>';
    if(/^->/.test(t)) return '<p class="arrow">'+e+'</p>';
    if(/^\d+\.\s/.test(t)) return '<p class="nlist">'+e+'</p>';
    return '<p>'+e+'</p>';
  }).join('\n');
}

function getContentHtml(id){
  const saved=localStorage.getItem(STORE+id);
  return textToHtml(saved!==null ? saved : (MAP[id]?.content||''));
}
function getContentText(id){
  const saved=localStorage.getItem(STORE+id);
  return saved!==null ? saved : htmlToText(MAP[id]?.content||'');
}

function updateSidebarMark(id){
  const nav=document.getElementById('nav_'+id);
  if(!nav) return;
  const existing=nav.querySelector('.edit-dot');
  if(hasEdit(id)){
    if(!existing){const d=document.createElement('span');d.className='edit-dot';d.title='ローカル編集済み';nav.appendChild(d);}
  }else{existing?.remove();}
}
function initEditMarks(){ ENTRIES.forEach(e=>updateSidebarMark(e.id)); }

function toggleCat(id){
  const ul=document.getElementById('items_'+id);
  const tog=document.getElementById('toggle_'+id);
  if(!ul) return;
  const open=ul.classList.contains('expanded');
  ul.classList.toggle('expanded',!open);
  tog.classList.toggle('open',!open);
}

function showEntry(id){
  const e=MAP[id];
  if(!e) return;
  document.querySelectorAll('.item').forEach(el=>el.classList.remove('active'));
  const nav=document.getElementById('nav_'+id);
  if(nav){ nav.classList.add('active'); nav.scrollIntoView({block:'nearest'}); }
  const nkHtml=e.nkUrl ? '<a class="nk-btn" href="'+e.nkUrl+'" target="_blank" rel="noopener">netkeiba 血統ページ</a>' : '';
  const editedMark=hasEdit(id) ? '<span class="edited-mark">✏ 編集済み</span>' : '';
  const catTagHtml=e.badgeLabel!==e.cat ? '<span class="cat-tag">'+esc(e.cat)+'</span>' : '';
  const customMark=e.isCustom ? '<span class="custom-mark">カスタム</span>' : '';
  const delBtn=e.isCustom ? '<button class="btn-delete-custom" onclick="deleteCustomEntry(\''+escAttr(id)+'\')" style="margin-left:auto">削除</button>' : '';
  document.getElementById('content').innerHTML=
    '<div class="breadcrumb">'+
      '<span>🏠</span><span class="bc-sep">›</span>'+
      '<span>'+esc(e.cat)+'</span><span class="bc-sep">›</span>'+
      '<span class="bc-cur">'+esc(e.name)+'</span>'+editedMark+
    '</div>'+
    '<div class="card">'+
      '<div class="card-head">'+
        '<div class="entry-name-row">'+
          '<span class="card-name">'+esc(e.name)+'</span>'+customMark+
          '<button class="edit-btn" onclick="startEdit(\''+escAttr(e.id)+'\')">&#9999;&#65039; 編集</button>'+
          delBtn+
        '</div>'+
        '<div class="card-meta">'+
          '<span class="badge" style="background:'+e.badgeColor+'">'+esc(e.badgeLabel)+'</span>'+
          catTagHtml+nkHtml+
        '</div>'+
      '</div>'+
      '<hr class="divider">'+
      '<div class="content-body">'+getContentHtml(id)+'</div>'+
    '</div>';
}

function startEdit(id){
  const e=MAP[id];
  if(!e) return;
  const currentText=getContentText(id);
  const nkHtml=e.nkUrl ? '<a class="nk-btn" href="'+e.nkUrl+'" target="_blank" rel="noopener">netkeiba 血統ページ</a>' : '';
  const editedMark=hasEdit(id) ? '<span class="edited-mark">&#9999; 編集済み</span>' : '';
  const catTagHtml=e.badgeLabel!==e.cat ? '<span class="cat-tag">'+esc(e.cat)+'</span>' : '';
  document.getElementById('content').innerHTML=
    '<div class="breadcrumb">'+
      '<span>🏠</span><span class="bc-sep">›</span>'+
      '<span>'+esc(e.cat)+'</span><span class="bc-sep">›</span>'+
      '<span class="bc-cur">'+esc(e.name)+'</span>'+editedMark+
    '</div>'+
    '<div class="card">'+
      '<div class="card-head">'+
        '<div class="entry-name-row"><span class="card-name">'+esc(e.name)+'</span></div>'+
        '<div class="card-meta">'+
          '<span class="badge" style="background:'+e.badgeColor+'">'+esc(e.badgeLabel)+'</span>'+
          catTagHtml+nkHtml+
        '</div>'+
      '</div>'+
      '<hr class="divider">'+
      '<textarea class="edit-textarea" id="edit_ta_'+escAttr(id)+'">'+esc(currentText)+'</textarea>'+
      '<div class="edit-actions">'+
        '<button class="btn-save" onclick="saveEdit(\''+escAttr(id)+'\')">保存</button>'+
        '<button class="btn-cancel" onclick="cancelEdit(\''+escAttr(id)+'\')">キャンセル</button>'+
        (hasEdit(id) ? '<button class="btn-reset" onclick="resetEdit(\''+escAttr(id)+'\')">リセット（元に戻す）</button>' : '')+
      '</div>'+
    '</div>';
  document.getElementById('edit_ta_'+id)?.focus();
}

function saveEdit(id){
  const ta=document.getElementById('edit_ta_'+id);
  if(!ta) return;
  localStorage.setItem(STORE+id,ta.value.trim());
  updateSidebarMark(id);
  showEntry(id);
}
function cancelEdit(id){ showEntry(id); }
function resetEdit(id){
  if(!confirm('このエントリの編集をリセットして元のデータに戻しますか？')) return;
  localStorage.removeItem(STORE+id);
  updateSidebarMark(id);
  showEntry(id);
}

function onSearch(q){
  const r=document.getElementById('searchResults');
  if(!q.trim()){ r.classList.remove('visible'); return; }
  const lq=q.toLowerCase();
  const hits=ENTRIES.filter(e=>e.name.toLowerCase().includes(lq)||e.cat.toLowerCase().includes(lq)).slice(0,20);
  if(!hits.length){ r.innerHTML='<div class="sr-header">0件</div>'; r.classList.add('visible'); return; }
  const items=hits.map(e=>'<button class="sr-item" onmousedown="pickSearch(\''+escAttr(e.id)+'\')">'+esc(e.name)+'<span class="sr-cat">'+esc(e.cat)+'</span></button>').join('');
  r.innerHTML='<div class="sr-header">'+hits.length+'件</div><div class="sr-list">'+items+'</div>';
  r.classList.add('visible');
}
function pickSearch(id){
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').classList.remove('visible');
  const e=MAP[id];
  if(e){
    const ul=document.getElementById('items_'+e.cat);
    const tog=document.getElementById('toggle_'+e.cat);
    if(ul&&!ul.classList.contains('expanded')){ ul.classList.add('expanded'); if(tog) tog.classList.add('open'); }
  }
  showEntry(id);
}
function hideSearch(){ document.getElementById('searchResults').classList.remove('visible'); }


// ── Custom entry management ───────────────────
const CUSTOM_KEY = 'ped_custom_entries';

const CAT_BADGE_MAP = {
  '種牡馬': { color: '#2e7d32', label: '種牡馬' },
  '牝系':   { color: '#e84393', label: '牝系' },
  '各国の血統特徴': { color: '#3a7bd5', label: '地域' },
  '特定の海外レース': { color: '#e67e22', label: '海外レース' },
  '大枠分類': { color: '#5e60ce', label: '大枠' },
  '系統組み合わせ': { color: '#795548', label: '系統' },
};

function loadCustomEntries() {
  const stored = localStorage.getItem(CUSTOM_KEY);
  if (!stored) return;
  let customs;
  try { customs = JSON.parse(stored); } catch(e) { return; }
  customs.forEach(e => {
    if (MAP[e.id]) return; // skip if already exists (static entry)
    MAP[e.id] = e;
    appendSidebarItem(e.cat, e.id, e.name);
    updateCatCount(e.cat);
  });
}

function appendSidebarItem(cat, id, name) {
  const ul = document.getElementById('items_' + cat);
  if (!ul) return;
  const li = document.createElement('li');
  const btn = document.createElement('button');
  btn.className = 'item';
  btn.id = 'nav_' + id;
  btn.textContent = name;
  btn.onclick = () => showEntry(id);
  li.appendChild(btn);
  ul.appendChild(li);
}

function sortCatItems(cat) {
  const ul = document.getElementById('items_' + cat);
  if (!ul) return;
  const items = Array.from(ul.querySelectorAll('li'));
  items.sort((a, b) => {
    const na = a.querySelector('button.item')?.textContent || '';
    const nb = b.querySelector('button.item')?.textContent || '';
    return na.localeCompare(nb, 'ja');
  });
  items.forEach(li => ul.appendChild(li));
}

function sortAllCats() {
  document.querySelectorAll('.cat-items').forEach(ul => {
    const catId = ul.id.replace('items_', '');
    sortCatItems(catId);
  });
}

function updateCatCount(cat) {
  const tog = document.getElementById('toggle_' + cat);
  if (!tog) return;
  const countEl = tog.querySelector('.cat-count');
  if (!countEl) return;
  const ul = document.getElementById('items_' + cat);
  if (!ul) return;
  const n = ul.querySelectorAll('button.item').length;
  countEl.textContent = n;
}

let _addModalCat = '';

function checkModalName(val) {
  const name = val.trim();
  const errEl = document.getElementById('modal-name-error');
  const saveBtn = document.getElementById('modal-save-btn');
  if (name && MAP[name]) {
    errEl.style.display = 'block';
    saveBtn.disabled = true;
    saveBtn.style.opacity = '0.45';
    saveBtn.style.cursor = 'not-allowed';
  } else {
    errEl.style.display = 'none';
    saveBtn.disabled = false;
    saveBtn.style.opacity = '';
    saveBtn.style.cursor = '';
  }
}

function openAddModal(cat) {
  _addModalCat = cat;
  document.getElementById('modal-cat').value = cat;
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-url').value = '';
  document.getElementById('modal-content').value = '';
  document.getElementById('modal-name-error').style.display = 'none';
  const saveBtn = document.getElementById('modal-save-btn');
  saveBtn.disabled = false;
  saveBtn.style.opacity = '';
  saveBtn.style.cursor = '';
  document.getElementById('addModal').classList.add('visible');
  setTimeout(() => document.getElementById('modal-name').focus(), 50);
}

function closeAddModal(e) {
  if (e && e.target !== document.getElementById('addModal')) return;
  document.getElementById('addModal').classList.remove('visible');
}

function saveNewEntry() {
  const name = document.getElementById('modal-name').value.trim();
  const url  = document.getElementById('modal-url').value.trim();
  const text = document.getElementById('modal-content').value.trim();
  const cat  = _addModalCat;
  const errEl = document.getElementById('modal-name-error');

  if (!name) { document.getElementById('modal-name').focus(); return; }

  if (MAP[name]) {
    errEl.style.display = 'block';
    document.getElementById('modal-name').focus();
    return;
  }
  errEl.style.display = 'none';

  const badge = CAT_BADGE_MAP[cat] || { color: '#607d8b', label: cat };
  const entry = {
    id: name, name, cat,
    etype: '', badgeColor: badge.color, badgeLabel: badge.label,
    nkUrl: url, content: '', isCustom: true,
  };

  // Store content text (will be picked up by getContentHtml via STORE)
  if (text) localStorage.setItem(STORE + name, text);

  // Persist to CUSTOM_KEY
  const stored = localStorage.getItem(CUSTOM_KEY);
  const customs = stored ? JSON.parse(stored) : [];
  customs.push(entry);
  localStorage.setItem(CUSTOM_KEY, JSON.stringify(customs));

  // Register in MAP and sidebar
  MAP[name] = entry;
  appendSidebarItem(cat, name, name);
  sortCatItems(cat);
  updateCatCount(cat);
  updateSidebarMark(name);

  // Expand the category if not open
  const ul = document.getElementById('items_' + cat);
  const tog = document.getElementById('toggle_' + cat);
  if (ul && !ul.classList.contains('expanded')) {
    ul.classList.add('expanded');
    if (tog) tog.classList.add('open');
  }

  document.getElementById('addModal').classList.remove('visible');
  showEntry(name);
}

function deleteCustomEntry(id) {
  if (!confirm('"' + id + '" を削除しますか？（この操作は取り消せません）')) return;

  // Remove from CUSTOM_KEY
  const stored = localStorage.getItem(CUSTOM_KEY);
  if (stored) {
    const customs = JSON.parse(stored).filter(e => e.id !== id);
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(customs));
  }

  // Remove content edit if exists
  localStorage.removeItem(STORE + id);

  // Remove from MAP
  const cat = MAP[id]?.cat;
  delete MAP[id];

  // Remove sidebar item
  const nav = document.getElementById('nav_' + id);
  if (nav) nav.closest('li')?.remove();
  if (cat) updateCatCount(cat);

  // Show welcome screen
  document.getElementById('content').innerHTML =
    '<div class="welcome"><h2>エントリを削除しました</h2><p>サイドバーから別のエントリを選択してください</p></div>';
}

document.querySelectorAll('.cat-header')[0]?.click();
initEditMarks();
loadCustomEntries();
sortAllCats();

</script>

  <div class="modal" onclick="event.stopPropagation()">

    <div class="modal-field">

      <div class="modal-error" id="modal-name-error">同じ名前のエントリが既に存在します。</div>

    </div>

      <label>メモ（任意）</label>
      <textarea id="modal-content" placeholder="馬の特徴・血統的な特性などを自由に記述できます。&#10;&#10;【ラベル】や ・箇条書き、★重要 なども使えます。"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-save" id="modal-save-btn" onclick="saveNewEntry()">追加</button>
      <button class="btn-cancel" onclick="closeAddModal()">キャンセル</button>
    </div>
  </div>
</div>
