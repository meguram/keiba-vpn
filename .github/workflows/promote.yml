name: promote

# master ブランチへの push（stg → master のマージ）で、本番に反映する。stg に入っていないコミットは出さない。
# 流れ: stg に含まれるか確認 → テスト + 画面のビルド → 【承認】 → API の通信 0% リビジョン → スモーク → 通信を切り替え → Jobs の更新 → 画面を GCS に公開
# 画面は、VPS が pull_release.py で窓（JST 03:10）に取りに行く。手順・設定・ロールバック: docs/operations/github_promote.md
# 方針: 鍵ファイルは使わない（Workload Identity Federation）。取得（スクレイピング）は CI で一切しない。
#       当てはめ済みの係数（config/fitted_artifacts.txt）はビルドに含まれない（実行時に GCS から取得）。
# 承認は 1 回: Environment「production」の Required reviewers。反映の工程は 1 つの job にまとめてある（途中で承認待ちにならない）。

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "テストを飛ばす（緊急時のみ）"
        type: boolean
        default: false
      skip_stg_check:
        description: "stg に含まれるかの確認を飛ばす（緊急時のみ）"
        type: boolean
        default: false

# 既定は最小権限。反映の job だけ id-token: write を足す
permissions:
  contents: read

# 同時に 2 本の昇格を走らせない（途中で打ち切らない）
concurrency:
  group: promote
  cancel-in-progress: false

env:
  FORCE_COLOR: "0"

jobs:
  # stg で確認していないコミットを本番に出さない。master の先頭が、stg に含まれる（fast-forward）か、stg を取り込んだマージコミットであること。
  verify-stg:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_stg_check) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4   # PIN
        with:
          fetch-depth: 0
      - name: master の先頭が stg に含まれること
        run: |
          set -euo pipefail
          git fetch origin stg
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/stg; then
            echo "OK: $GITHUB_SHA は stg に含まれています"
          elif [ "$(git rev-list --parents -n1 "$GITHUB_SHA" | wc -w)" -ge 3 ] && git merge-base --is-ancestor "${GITHUB_SHA}^2" origin/stg; then
            echo "OK: stg(${GITHUB_SHA}^2) を取り込んだマージです"
          else
            echo "::error::このコミットは stg に含まれていません。develop → stg → master の順にマージしてください（スカッシュマージは使わない）"
            exit 1
          fi

  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    uses: ./.github/workflows/_test.yml

  build-ui:
    # test が成功、または skip_tests で飛ばされたときだけ進む
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    uses: ./.github/workflows/_build-ui.yml

  # 承認の関門: Environment「production」の Required reviewers（リポジトリ設定でユーザーが追加）が承認するまで、この job は始まらない。
  # 工程は上から順。スモークに失敗したら通信は切り替わらず、以降（Jobs・画面の公開）も進まない。
  deploy:
    needs: [verify-stg, build-ui]
    if: ${{ always() && (needs.verify-stg.result == 'success' || needs.verify-stg.result == 'skipped') && needs.build-ui.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      REGION: ${{ vars.CLOUD_RUN_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      SMOKE_RACE_ID: ${{ vars.SMOKE_RACE_ID }}
      ENABLE_JOBS_DEPLOY: ${{ vars.ENABLE_JOBS_DEPLOY }}
      JOBS_PARALLEL: ${{ vars.JOBS_PARALLEL }}
      FETCH_SHADOW: ${{ vars.FETCH_SHADOW }}
      GCP_BILLING_BQ_TABLE: ${{ vars.GCP_BILLING_BQ_TABLE }}
    steps:
      - uses: actions/checkout@v4   # PIN
      - uses: actions/download-artifact@v4   # PIN
        with:
          name: ui-release
          path: release
      - name: 画面の成果物の検算（承認の間に差し替わっていないこと）
        run: |
          cd release && sha256sum -c ./*.sha256 && ls -l
      - name: GCP に認証（Workload Identity Federation。鍵ファイルは使わない）
        uses: google-github-actions/auth@v2   # PIN
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2   # PIN
      - uses: actions/setup-python@v5   # PIN
        with:
          python-version: "3.11"
      - name: 公開に必要な最小限の依存
        run: pip install google-cloud-storage python-dotenv uvicorn
      - name: API と Jobs のイメージを作って push
        run: bash scripts/ci/deploy_gcp.sh build-images --target prod
      - name: API の通信 0% のタグ付きリビジョンを作る
        id: revision
        run: bash scripts/ci/deploy_gcp.sh api-revision --target prod
      - name: スモーク（失敗したら通信は切り替えない）
        env:
          SMOKE_BASE: ${{ steps.revision.outputs.tag_url }}
        run: bash scripts/ci/deploy_gcp.sh smoke --target prod
      - name: 通信を新リビジョンに切り替える（戻すときは scripts/gcp/rollback_cloud_run_api.sh）
        run: bash scripts/ci/deploy_gcp.sh promote --target prod
      - name: Jobs の更新（ENABLE_JOBS_DEPLOY=true のときだけ。JOBS_PARALLEL=1 の間は並走=影モード）
        run: bash scripts/ci/deploy_gcp.sh jobs --target prod
      - name: 画面を GCS に公開（latest.json を最後に書く）
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          f="$(ls release/keiba-ui-*.tar.gz | head -1)"
          python -m src.ops.release_publish publish-ui --file "$f" --commit "$GITHUB_SHA"
          python -m src.ops.release_publish status --kind ui
      - name: VPS が画面を取り込むのを待つ（UI_WAIT_MINUTES が 0 または未設定なら待たない。API と画面の版ずれが続く時間の確認用）
        env:
          PYTHONPATH: .
          UI_WAIT_MINUTES: ${{ vars.UI_WAIT_MINUTES }}
        run: |
          set -uo pipefail
          res="$(python -m src.ops.release_publish wait-applied --kind ui --minutes "${UI_WAIT_MINUTES:-0}")" || true
          echo "$res"
          case "$res" in
            *'"result": "ok"'*) echo "VPS が新しい画面を取り込みました" ;;
            *'"result": "skipped"'*) ;;
            *) echo "::warning title=画面の取り込みを確認できません::API は新しい版に切り替え済みですが、VPS の画面がまだ古い可能性があります（API と画面の版ずれ）。VPS の keiba-release-pull-ui を確認してください: ${res}" ;;
          esac
      - name: 取得役のコードを GCS に公開（kind=fetch。latest.json を最後に書く。VPS の keiba-release-pull-fetch.timer が JST 03:20 に取り込む）
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          out="$(python -m src.ops.release_publish build-fetch --out "$RUNNER_TEMP/fetch" | tail -n1)"
          ls -l "$out"
          python -m src.ops.release_publish publish-fetch --file "$out" --commit "$GITHUB_SHA"
          python -m src.ops.release_publish status --kind fetch
      - name: 結果の要約
        run: |
          {
            echo "### 本番に反映しました"
            echo "- コミット: \`$GITHUB_SHA\`"
            echo "- API: 新リビジョンに通信を切り替え済み → ${{ steps.revision.outputs.tag_url }}"
            echo "- Jobs: ENABLE_JOBS_DEPLOY=${ENABLE_JOBS_DEPLOY:-未設定}（true のときだけ更新）。並走(影モード): JOBS_PARALLEL=${JOBS_PARALLEL:-1}。取得の影モード: FETCH_SHADOW=${FETCH_SHADOW:-0}"
            echo "- 画面: \`${{ needs.build-ui.outputs.release_id }}\`。VPS は次の窓（毎日 JST 03:10）に取得します"
            echo "- 取得役のコード: GCS の ops/releases/fetch/ に公開済み。VPS は毎日 JST 03:20 に取り込みます"
          } >> "$GITHUB_STEP_SUMMARY"
