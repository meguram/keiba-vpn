# =============================================================================
# deploy-vps.yml — VPS（ConoHa）サービング用イメージのビルド・デプロイ
# =============================================================================
#
# 目的: Dockerfile.serving から軽量なサービング専用イメージをビルドし GHCR へpush、
# VPS側へSSHして `docker compose -f docker-compose.serving.yml pull && up -d` 相当を
# 実行する。VPSはこのワークフローが作ったイメージだけを受け取れば動く
# （設計の詳細は docs/operations/cicd-design.md）。
#
# トリガー: stg / master ブランチへのpush（現時点ではいずれも空のorphanブランチだが、
# 将来これらにコードが入った時点で有効化される設計）。
#
# 必要なGitHub Secrets（本ワークフロー作成時点では未設定の前提。設定はユーザー側の
# 今後の作業。詳細は docs/operations/cicd-design.md）:
#   - VPS_SSH_HOST : VPSのホスト名/IP
#   - VPS_SSH_USER : SSHログインユーザー
#   - VPS_SSH_KEY  : SSH秘密鍵（appleboy/ssh-action用、PEM形式）
#   - VPS_SSH_PORT : （任意）SSHポート。未設定時は22
#   - VPS_APP_DIR  : （任意）VPS上の docker-compose.serving.yml 配置先ディレクトリ。
#                     未設定時は "~/keiba-vpn-serving" を使う
#
# GITHUB_TOKEN（追加のレジストリ契約は不要。デフォルトで付与されるトークンでGHCRへpushできる）
# =============================================================================

name: Deploy VPS (serving)

on:
  push:
    branches: [stg, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-serving

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (branch + short SHA)
        id: meta
        run: |
          short_sha="$(echo "${{ github.sha }}" | cut -c1-12)"
          echo "image_tag=${{ github.ref_name }}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push serving image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.serving
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Secrets未設定の環境では以降のステップは失敗する想定（ユーザー側の今後の設定作業）。
    steps:
      - name: Deploy over SSH (docker compose pull && up -d)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euxo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            APP_DIR="${APP_DIR:-$HOME/keiba-vpn-serving}"
            cd "$APP_DIR"
            export KEIBA_SERVING_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}"
            echo "KEIBA_SERVING_IMAGE=${KEIBA_SERVING_IMAGE}" > .env.image
            docker compose -f docker-compose.serving.yml pull
            docker compose -f docker-compose.serving.yml up -d --remove-orphans
