name: deploy-stg

# stg ブランチへの push（develop → stg のマージ）で、stg 環境に反映する。本番の通信・Jobs・画面の公開は動かさない。
# 流れ（変更に応じて動く job だけ並走。scripts/ci/stg_changes.sh が決める）:
#   画面（frontend/ 等の変更）: [画面のビルド] → 画面を公開（約 2 分。API を待たない）
#   API（コード・設定の変更）: [API のイメージ → 通信 0% のタグ付きリビジョン(rstg) → スモーク] ‖ [Jobs のイメージの読み込み確認]（約 4 分）
#   文書・テストだけの変更は、どちらも動かさない。手動実行は両方動かす
# テストはここでは走らせない（同じコミットの push で ci.yml が走る＝二重になるため）。本番(master)の反映は、テストと stg 含有の確認が関門のまま。
# 手順・設定・ロールバック: docs/operations/github_promote.md
# 方針: 鍵ファイルは使わない（Workload Identity Federation）。取得（スクレイピング）は CI で一切しない。

on:
  push:
    branches: [stg]
  workflow_dispatch:

permissions:
  contents: read

# 同時に 2 本の反映を走らせない（途中で打ち切らない）
concurrency:
  group: deploy-stg
  cancel-in-progress: false

env:
  FORCE_COLOR: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.c.outputs.api }}
      ui: ${{ steps.c.outputs.ui }}
    steps:
      - uses: actions/checkout@v4   # PIN
        with:
          fetch-depth: 0
      - id: c
        name: 何を反映するか（変更されたファイルから決める。迷ったら両方）
        env:
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/stg_changes.sh "$BEFORE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  build-ui:
    needs: [changes]
    if: ${{ needs.changes.outputs.ui == 'true' }}
    uses: ./.github/workflows/_build-ui.yml
    with:
      env_label: stg                         # 画面端に STG と出る
      upstream: "http://127.0.0.1:8081"      # VPS の stg 用 nginx（Cloud Run の stg タグ付きリビジョンへ中継）

  # Jobs のイメージが作れて、全ジョブのモジュールを読み込めるか（push しない・GCP に接続しない。API の反映を待たせない）
  check-jobs-image:
    needs: [changes]
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      REGION: ${{ vars.CLOUD_RUN_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - uses: actions/checkout@v4   # PIN
      - name: Jobs のイメージを作り、全ジョブの実行モジュールを読み込めるか確かめる
        run: bash scripts/ci/deploy_gcp.sh check-jobs-image --target stg

  deploy:
    needs: [changes]
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      REGION: ${{ vars.CLOUD_RUN_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      SMOKE_RACE_ID: ${{ vars.SMOKE_RACE_ID }}
    steps:
      - uses: actions/checkout@v4   # PIN
      - name: GCP に認証（Workload Identity Federation。鍵ファイルは使わない）
        uses: google-github-actions/auth@v2   # PIN
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2   # PIN
      - uses: actions/setup-python@v5   # PIN
        with:
          python-version: "3.11"
      - name: 係数の取得に必要な依存
        run: pip install google-cloud-storage python-dotenv
      - name: API のイメージを作って push
        run: bash scripts/ci/deploy_gcp.sh build-api-image --target stg
      - name: 通信 0% のタグ付きリビジョン（rstg）を作る
        id: revision
        run: bash scripts/ci/deploy_gcp.sh api-revision --target stg
      - name: スモーク（鍵なし 401・鍵あり 200・ハートビート）
        env:
          SMOKE_BASE: ${{ steps.revision.outputs.tag_url }}
        run: bash scripts/ci/deploy_gcp.sh smoke --target stg
      - name: 結果の要約
        run: |
          {
            echo "### stg の API に反映しました"
            echo "- コミット: \`$GITHUB_SHA\`"
            echo "- 通信 0% のタグ付きリビジョン \`rstg\` → ${{ steps.revision.outputs.tag_url }}（stg の画面は VPS の nginx 経由でここへ中継）"
          } >> "$GITHUB_STEP_SUMMARY"

  # 画面の公開は、画面のビルドができた後だけ（API の反映は待たない。stg は API を 0% のタグで別に持つため、画面だけ先に新しくなってよい）
  publish-stg-ui:
    needs: [changes, build-ui]
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stg
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
    steps:
      - uses: actions/checkout@v4   # PIN
      - name: GCP に認証（Workload Identity Federation。鍵ファイルは使わない）
        uses: google-github-actions/auth@v2   # PIN
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5   # PIN
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4   # PIN
        with:
          name: ui-release
          path: release
      - name: 画面を stg 用として GCS に公開（latest.json を最後に書く。VPS が 5 分おきに取り込む）
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pip install google-cloud-storage python-dotenv
          (cd release && sha256sum -c ./*.sha256)
          f="$(ls release/keiba-ui-*.tar.gz | head -1)"
          python -m src.ops.release_publish publish-ui-stg --file "$f" --commit "$GITHUB_SHA"
          python -m src.ops.release_publish status --kind ui-stg
      - name: 結果の要約
        run: |
          {
            echo "### stg に反映しました"
            echo "- コミット: \`$GITHUB_SHA\`"
            echo "- 画面: ops/releases/ui-stg/ に公開しました。VPS の stg 用の画面（stg.megu-keiba.com）が 5 分おきに取り込みます"
            echo "- 本番の通信・Jobs・本番の画面は変えていません。本番へは stg → master のマージ（承認あり）"
          } >> "$GITHUB_STEP_SUMMARY"
