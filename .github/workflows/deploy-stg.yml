name: deploy-stg

# stg ブランチへの push（develop → stg のマージ）で、stg 環境に反映する。本番の通信・Jobs・画面の公開は動かさない。
# 流れ: テスト + 画面のビルド確認 → API/Jobs のイメージ作成 → 通信 0% のタグ付きリビジョン(rstg)を作る → スモーク
# 手順・設定・ロールバック: docs/operations/github_promote.md
# 方針: 鍵ファイルは使わない（Workload Identity Federation）。取得（スクレイピング）は CI で一切しない。

on:
  push:
    branches: [stg]
  workflow_dispatch: {}

permissions:
  contents: read

# 同時に 2 本の反映を走らせない（途中で打ち切らない）
concurrency:
  group: deploy-stg
  cancel-in-progress: false

env:
  FORCE_COLOR: "0"

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  build-ui:
    needs: [test]
    uses: ./.github/workflows/_build-ui.yml

  deploy:
    needs: [test, build-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      REGION: ${{ vars.CLOUD_RUN_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      SMOKE_RACE_ID: ${{ vars.SMOKE_RACE_ID }}
    steps:
      - uses: actions/checkout@v4   # PIN
      - name: GCP に認証（Workload Identity Federation。鍵ファイルは使わない）
        uses: google-github-actions/auth@v2   # PIN
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2   # PIN
      - uses: actions/setup-python@v5   # PIN
        with:
          python-version: "3.11"
      - name: API と Jobs のイメージを作って push
        run: bash scripts/ci/deploy_gcp.sh build-images --target stg
      - name: 通信 0% のタグ付きリビジョン（rstg）を作る
        id: revision
        run: bash scripts/ci/deploy_gcp.sh api-revision --target stg
      - name: スモーク（鍵なし 401・鍵あり 200・ハートビート）
        env:
          SMOKE_BASE: ${{ steps.revision.outputs.tag_url }}
        run: bash scripts/ci/deploy_gcp.sh smoke --target stg
      - name: 結果の要約
        run: |
          {
            echo "### stg に反映しました"
            echo "- コミット: \`$GITHUB_SHA\`"
            echo "- API: 通信 0% のタグ付きリビジョン \`rstg\` → ${{ steps.revision.outputs.tag_url }}"
            echo "- 本番の通信・Jobs・画面は変えていません。本番へは stg → master のマージ（承認あり）"
          } >> "$GITHUB_STEP_SUMMARY"
