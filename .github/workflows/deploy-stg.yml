name: deploy-stg

# stg ブランチへの push（develop → stg のマージ）で、stg 環境に反映する。本番の通信・Jobs・画面の公開は動かさない。
# 流れ: テスト + 画面のビルド確認 → API/Jobs のイメージ作成 → 通信 0% のタグ付きリビジョン(rstg)を作る → スモーク
# 手順・設定・ロールバック: docs/operations/github_promote.md
# 方針: 鍵ファイルは使わない（Workload Identity Federation）。取得（スクレイピング）は CI で一切しない。

on:
  push:
    branches: [stg]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "テストを飛ばす（緊急時、または自動反映の経路そのものを確かめるときだけ）"
        type: boolean
        default: false

permissions:
  contents: read

# 同時に 2 本の反映を走らせない（途中で打ち切らない）
concurrency:
  group: deploy-stg
  cancel-in-progress: false

env:
  FORCE_COLOR: "0"

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    uses: ./.github/workflows/_test.yml

  build-ui:
    # test が成功、または skip_tests で飛ばされたときだけ進む
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    uses: ./.github/workflows/_build-ui.yml
    with:
      env_label: stg                         # 画面端に STG と出る
      upstream: "http://127.0.0.1:8081"      # VPS の stg 用 nginx（Cloud Run の stg タグ付きリビジョンへ中継）

  deploy:
    needs: [test, build-ui]
    if: ${{ always() && needs.build-ui.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      REGION: ${{ vars.CLOUD_RUN_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      SMOKE_RACE_ID: ${{ vars.SMOKE_RACE_ID }}
    steps:
      - uses: actions/checkout@v4   # PIN
      - name: GCP に認証（Workload Identity Federation。鍵ファイルは使わない）
        uses: google-github-actions/auth@v2   # PIN
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2   # PIN
      - uses: actions/setup-python@v5   # PIN
        with:
          python-version: "3.11"
      - name: API と Jobs のイメージを作って push
        run: bash scripts/ci/deploy_gcp.sh build-images --target stg
      - name: 通信 0% のタグ付きリビジョン（rstg）を作る
        id: revision
        run: bash scripts/ci/deploy_gcp.sh api-revision --target stg
      - name: スモーク（鍵なし 401・鍵あり 200・ハートビート）
        env:
          SMOKE_BASE: ${{ steps.revision.outputs.tag_url }}
        run: bash scripts/ci/deploy_gcp.sh smoke --target stg
      - uses: actions/download-artifact@v4   # PIN
        with:
          name: ui-release
          path: release
      - name: 画面を stg 用として GCS に公開（スモークが通った後だけ。latest.json を最後に書く。VPS が 5 分おきに取り込む）
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pip install google-cloud-storage python-dotenv
          (cd release && sha256sum -c ./*.sha256)
          f="$(ls release/keiba-ui-*.tar.gz | head -1)"
          python -m src.ops.release_publish publish-ui-stg --file "$f" --commit "$GITHUB_SHA"
          python -m src.ops.release_publish status --kind ui-stg
      - name: 結果の要約
        run: |
          {
            echo "### stg に反映しました"
            echo "- コミット: \`$GITHUB_SHA\`"
            echo "- API: 通信 0% のタグ付きリビジョン \`rstg\` → ${{ steps.revision.outputs.tag_url }}"
            echo "- 画面: ops/releases/ui-stg/ に公開しました。VPS の stg 用の画面（stg.megu-keiba.com）が 5 分おきに取り込みます（vps_05_stg_instance.sh を入れた後）"
            echo "- 本番の通信・Jobs・本番の画面は変えていません。本番へは stg → master のマージ（承認あり）"
          } >> "$GITHUB_STEP_SUMMARY"
