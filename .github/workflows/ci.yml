name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keiba
          POSTGRES_PASSWORD: keiba
          POSTGRES_DB: keiba
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+psycopg://keiba:keiba@localhost:5432/keiba
      REDIS_URL: redis://localhost:6379/0
      GCS_BUCKET: test-bucket
      DEV_PASSWORD: test-dev-password
      DEV_SECRET_KEY: test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Alembic migration check
        run: alembic upgrade head

      - name: No shuffle in time split (static)
        run: python -m src.scripts.ci.check_no_shuffle

      - name: Unit & integration tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/scraper/manual \
            --ignore=tests/research/manual \
            -q --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=50

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm run build
        env:
          KEIBA_API_URL: http://127.0.0.1:5000
