<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}運用監視{% endblock %} | めぐ競馬</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--s1:#3987e5;--s2:#d95926}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,'Segoe UI',sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 16px;flex-wrap:wrap}
header .brand{font-weight:700;color:var(--accent);margin-right:14px;padding:12px 0;font-size:13px;letter-spacing:.04em}
header a.tab{color:var(--muted);text-decoration:none;padding:13px 12px;border-bottom:2px solid transparent;font-size:13px}
header a.tab:hover{color:var(--text)}header a.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
header .right{margin-left:auto;color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:14px;margin:26px 0 8px;color:var(--text)}.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.muted,.dim{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;border:1px solid currentColor;font-size:12px;white-space:nowrap}
.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.unknown,.na{color:var(--muted)}.wait{color:var(--accent)}.ok{color:var(--green)}.warn{color:var(--yellow)}.ng{color:var(--red)}.info{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:baseline}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--border);padding:5px 8px;text-align:left;font-size:13px;vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.nw{white-space:nowrap}
.env-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.env-title b{font-size:14px}
.cell{border-left:4px solid var(--border)}.cell.green{border-left-color:var(--green)}.cell.yellow{border-left-color:var(--yellow)}.cell.red{border-left-color:var(--red)}
.cell .head{font-weight:600;margin-bottom:6px}.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}.kv span:first-child{color:var(--muted)}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}.kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:8px}
.stage{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}@media(max-width:860px){.stage{grid-template-columns:repeat(4,1fr)}}
.stage>div{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px}.stage>div>b{display:block;font-size:12px;color:var(--text)}
.race-grid td,.race-grid th{padding:2px 6px;text-align:center;font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}.bar>i{display:block;height:100%}
a{color:var(--accent)}.hint{background:#1f2430;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12.5px;color:var(--muted);margin:8px 0}
</style>{% block head %}{% endblock %}</head><body>
<header><span class="brand">めぐ競馬 運用監視</span>
{% for key, href, label in [('home','/','ホーム'),('pipeline','/pipeline','開催日パイプライン'),('traffic','/traffic','アクセス'),('seo','/seo','SEO'),('ops','/ops','詳細（Jobs・配布）')] %}
<a class="tab {{ 'on' if active == key }}" href="{{ href }}">{{ label }}</a>{% endfor %}
<span class="right">{{ generated_at }}</span></header>
<main>{% block body %}{% endblock %}</main></body></html>
