# /etc/nginx/conf.d/keiba-log.conf（http の文脈。vps_13_access_log.sh が配置）
# 応答時間とキャッシュの状態を残す 2 本目のアクセスログ。既定の access.log（nginx.conf）はそのまま。
# http の文脈に置くので、access_log を持たない全サイト（本番 8080・stg 8081・監視 8082）に効く。サイトのテンプレート
# （switch_api_upstream.sh が作り直す）に手を入れないので、上流の切り替えで外れない。
# 置き場は /var/log/nginx/keiba/（deploy が sudo なしで読める。logrotate は /etc/logrotate.d/keiba-nginx-timed。既定の *.log の回転とは別）。
# 項目: 時刻 実クライアント IP 要求 状態 送った量 rt=全体の秒 urt=上流の秒（HIT は -） cache=HIT/MISS/STALE/BYPASS など port=8080 本番/8081 stg ua= ce=送った圧縮
log_format keiba_timed '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                       'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status '
                       'port=$server_port ce=$sent_http_content_encoding ua="$http_user_agent"';
access_log /var/log/nginx/keiba/timed.log keiba_timed;
