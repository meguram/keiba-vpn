# http コンテキスト（/etc/nginx/conf.d/keiba-ui-zones.conf）。実クライアント IP ごとの制限（CF-Connecting-IP を real_ip にした後の $binary_remote_addr）
limit_req_zone $binary_remote_addr zone=keiba_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=keiba_page:10m rate=240r/m;
limit_req_status 429;
# 画像のキャッシュ置き場（/data/image/ の静的ファイル。会員区分に依存しないものだけ）
proxy_cache_path /var/cache/nginx/keiba_img levels=1:2 keys_zone=keiba_img:10m max_size=200m inactive=7d use_temp_path=off;
