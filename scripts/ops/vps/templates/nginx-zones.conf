# http コンテキスト（/etc/nginx/conf.d/keiba-ui-zones.conf）。実クライアント IP ごとの制限（CF-Connecting-IP を real_ip にした後の $binary_remote_addr）
limit_req_zone $binary_remote_addr zone=keiba_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=keiba_page:10m rate=240r/m;
limit_req_status 429;
# 画像のキャッシュ置き場（/data/image/ の静的ファイル。会員区分に依存しないものだけ）
proxy_cache_path /var/cache/nginx/keiba_img levels=1:2 keys_zone=keiba_img:10m max_size=200m inactive=7d use_temp_path=off;
# API 応答のキャッシュ置き場（匿名・許可リストだけ。上流が public を付けたものだけ入る。確定済みのレースは 1 か月置くので inactive は 35 日）。Cookie/Authorization 付きの要求は読まず・保存しない。
proxy_cache_path /var/cache/nginx/keiba_api levels=1:2 keys_zone=keiba_apicache:10m max_size=1g inactive=35d use_temp_path=off;
map "$http_cookie$http_authorization" $keiba_api_nocache {
    default 1;
    ""      0;
}
# 事前ロード（keiba-cache-warm）専用の「上書き取得」。合言葉つきの要求だけ、キャッシュを読まずに上流から取り直して保存し直す（空白の時間が出ない）。
# 合言葉は /etc/nginx/keiba-refresh.conf（root 専用。vps_09 が生成）に `"<token>" 1;` の形で入る。外部からは合言葉を知らないので効かない。
# 合言葉は 32 文字（既定の map_hash_bucket_size=64 に収まる長さ。48 文字だと nginx -t が落ち、ここで map_hash_bucket_size を足すと既存設定と重複して落ちた）。
map $http_x_keiba_refresh $keiba_refresh {
    default 0;
    include /etc/nginx/keiba-refresh.conf;
}
