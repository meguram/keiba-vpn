# http コンテキスト（/etc/nginx/conf.d/keiba-ui-zones.conf）。実クライアント IP ごとの制限（CF-Connecting-IP を real_ip にした後の $binary_remote_addr）
limit_req_zone $binary_remote_addr zone=keiba_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=keiba_page:10m rate=240r/m;
limit_req_status 429;
# API の制限の枠（外の実 IP ごと・127.0.0.1 の別枠）。サイトの /api/ の location が使う。vps_09 は無ければこの節を足す
#   外の要求は Cloudflare の CF-Connecting-IP が実 IP になる（real_ip）。127.0.0.1 のままなのは、この機械の中からの要求
#   （Next.js のサーバ側の取得・cache-warm）だけ。今までは 127.0.0.1 の全員が 1 つの 120 回/分の枠を分け合い、
#   2026-11-23 の 429 は 357 件すべてが 127.0.0.1 だった。127.0.0.1 の枠は「待ち受けのポート（本番 8080・stg 8081）× cache-warm か否か」
#   ごとに 1 つ（300 回/分・burst 300）。stg の試験や cache-warm の連続の取り直しで、本番の Next.js のサーバ側の取得が 429 にならない。
#   この枠は、外の利用者が SSR 経由で Cloud Run に届かせられる量の歯止めも兼ねる（全体の上限を外さない）。
#   キーを変えた zone は reload で使えないので、新しい名前にする（古い keiba_api は画像の location が使い続ける）。
map $remote_addr $keiba_api_ext_key {
    "127.0.0.1" "";
    default $binary_remote_addr;
}
map "$remote_addr:$server_port:$http_user_agent" $keiba_api_lo_key {
    "~^127\.0\.0\.1:(?<lo_port>\d+):keiba-cache-warm$" "warm:$lo_port";
    "~^127\.0\.0\.1:(?<lo_port2>\d+):"                "lo:$lo_port2";
    default "";
}
limit_req_zone $keiba_api_ext_key zone=keiba_api_ext:10m rate=120r/m;
limit_req_zone $keiba_api_lo_key zone=keiba_api_lo:1m rate=300r/m;
# API の制限の枠ここまで
# 画像のキャッシュ置き場（/data/image/ の静的ファイル。会員区分に依存しないものだけ）
proxy_cache_path /var/cache/nginx/keiba_img levels=1:2 keys_zone=keiba_img:10m max_size=200m inactive=7d use_temp_path=off;
# API 応答のキャッシュ置き場（匿名・許可リストだけ。上流が public を付けたものだけ入る。1 か月置くので inactive は 35 日）。Cookie/Authorization 付きの要求は読まず・保存しない。
# stg と本番で共有する。max_size は vps_09 がディスクの空きから決め直す（ここの 1g は初期値）。
proxy_cache_path /var/cache/nginx/keiba_api levels=1:2 keys_zone=keiba_apicache:10m max_size=1g inactive=35d use_temp_path=off;
map "$http_cookie$http_authorization" $keiba_api_nocache {
    default 1;
    ""      0;
}
# 事前ロード（keiba-cache-warm）専用の「上書き取得」。合言葉つきの要求だけ、キャッシュを読まずに上流から取り直して保存し直す（空白の時間が出ない）。
# 合言葉は /etc/nginx/keiba-refresh.conf（root 専用。vps_09 が生成）に `"<token>" 1;` の形で入る。外部からは合言葉を知らないので効かない。
# 合言葉は 32 文字（既定の map_hash_bucket_size=64 に収まる長さ。48 文字だと nginx -t が落ち、ここで map_hash_bucket_size を足すと既存設定と重複して落ちた）。
map $http_x_keiba_refresh $keiba_refresh {
    default 0;
    include /etc/nginx/keiba-refresh.conf;
}
# stg は読むだけ（保存しない）。stg のサイトの待ち受けポートを vps_09 が /etc/nginx/keiba-cache-readonly.conf に `"<port>" 1;` の形で書く。
map $server_port $keiba_cache_readonly {
    default 0;
    include /etc/nginx/keiba-cache-readonly.conf;
}
