# 監視ポータル(monitor.megu-keiba.com)の VPS 側の入口。vps_06_monitor_proxy.sh が項目(ホスト名・ポート)を置換して
# /etc/nginx/sites-available/keiba-monitor に置く。
# cloudflared(prod のトンネル。Access で保護済み) → この nginx(127.0.0.1:__MONITOR_PORT__) → Cloud Run の keiba-monitor(読み取り専用)
# 共有ヘッダ X-Keiba-Proxy-Key は API と同じ鍵(render_nginx_proxykey.sh が作る include)。ブラウザには出ない。
server {
    listen 127.0.0.1:__MONITOR_PORT__;
    server_name _;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 64k;
    server_tokens off;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $monitor_host __MONITOR_CLOUDRUN_HOST__;

    location / {
        limit_req zone=keiba_page burst=60 nodelay;
        proxy_pass https://$monitor_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $monitor_host;
        proxy_set_header Host $monitor_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        include /etc/nginx/keiba-proxykey.conf;
        proxy_redirect ~^https://__MONITOR_CLOUDRUN_HOST_RE__(.*)$ $1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 40s;
    }
}
