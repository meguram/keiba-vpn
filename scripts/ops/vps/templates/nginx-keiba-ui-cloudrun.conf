# /etc/nginx/sites-available/keiba-ui の『API を Cloud Run にする版』（switch_api_upstream.sh cloudrun が __NAME__ を置換して配置）。
# 現行版（API をホスト機に向ける）は nginx-keiba-ui.conf。違いは /api/・/data/image/ の上流だけ:
#   現行  : https://api-internal…（Cloudflare Access の Service Auth ヘッダ）
#   本版  : https://<Cloud Run の *.run.app>（共有ヘッダ X-Keiba-Proxy-Key）。実クライアント IP は X-Keiba-Client-IP で渡す
# cloudflared（127.0.0.1）→ この nginx(:__PROXY_PORT__) → ページ: Next.js(:__APP_PORT__) / API: Cloud Run
server {
    listen 127.0.0.1:__PROXY_PORT__;
    server_name _;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;
    server_tokens off;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $upstream_host __CLOUDRUN_HOST__;

    location ~ ^/(api/|data/image/) {
        limit_req zone=keiba_api burst=60 nodelay;
        proxy_pass https://$upstream_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream_host;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # ブラウザが送ってきた値は使わず、nginx が見た実クライアント IP だけを渡す（Cloud Run 側は鍵が通った要求にだけ採用）
        proxy_set_header X-Keiba-Client-IP $remote_addr;
        include /etc/nginx/keiba-proxykey.conf;   # X-Keiba-Proxy-Key（render_nginx_proxykey.sh が作る。640 root:www-data）
        proxy_redirect ~^https://__CLOUDRUN_HOST_RE__(.*)$ $1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 70s;       # Cloud Run のリクエスト上限 60 秒 + 余裕
        proxy_buffering on;
    }

    location / {
        limit_req zone=keiba_page burst=120 nodelay;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
