# /etc/nginx/snippets/keiba-edge-__EDGE_ENV__.conf（server の文脈。vps_14_edge_files.sh が __EDGE_ENV__ を prod / stg に置き換えて置く）
#
# ホストが手元のデータだけで作った API の応答（src/ops/edge_render.py）を、フォルダから返す。docs/operations/edge_cache_plan_20261121.md §10・§11。
# - 対象は匿名（Cookie も Authorization も無い）の GET/HEAD・クエリなしの、レースの詳細・予測と、開催日の一覧だけ。
#   確定済みは current/anon/、確定前（E5）は current/pre/。
# - フォルダに無い・対象外の要求は、内部の転送で /api/__edge_miss/... に回し、今の `location ~ ^/api/`（nginx の API キャッシュ → Cloud Run）が受ける。
#   上流へは $request_uri（元の URI）で頼むので、上流・キャッシュの鍵は今と同じ。rewrite はメソッドを保つ（error_page の転送は GET に変える）。
# - 止め方（reload なし）:
#   - 人: touch /srv/keiba-edge/__EDGE_ENV__/_ctl/OFF（deploy で置ける）
#   - 見張り（edge_stale_guard.sh）: _ctl/OFF.auto（全部）。確定前だけを止めるときは pre_live（→ current/pre）を空のフォルダ（_empty）に付け替える。
#     人の OFF には触れない。if の中で set を使うと try_files が効かなくなる（nginx の IfIsEvil）ので、確定前の切り替えは symlink で行う
# - サイトの設定では、この include を `location ~ ^/api/` より前に置く（正規表現の location は書いた順に当てるため）。
location ~ "^/api/(race/[0-9]{12}(/predictions)?|race-list/[0-9]{8})$" {
    limit_req zone=keiba_api_ext burst=60 nodelay;
    limit_req zone=keiba_api_lo burst=300 nodelay;
    # 対象外は今の経路へ（if の中は rewrite ... last だけ）
    if ($keiba_api_nocache) { rewrite ^ /api/__edge_miss$uri last; }                            # Cookie か Authorization がある（会員・ログイン中）
    if ($http_x_keiba_refresh != "") { rewrite ^ /api/__edge_miss$uri last; }                   # cache-warm の取り直し
    if ($args != "") { rewrite ^ /api/__edge_miss$uri last; }                                   # クエリ付き（with_result_status など）
    if ($request_method !~ ^(GET|HEAD)$) { rewrite ^ /api/__edge_miss$uri last; }
    if (-f /srv/keiba-edge/__EDGE_ENV__/_ctl/OFF) { rewrite ^ /api/__edge_miss$uri last; }      # 人の止め
    if (-f /srv/keiba-edge/__EDGE_ENV__/_ctl/OFF.auto) { rewrite ^ /api/__edge_miss$uri last; } # 見張りの止め（heartbeat が 30 分古い）
    root /srv/keiba-edge/__EDGE_ENV__;
    default_type "application/json; charset=utf-8";
    gzip_static on;
    # 上流（Cloud Run）の匿名の応答と同じ考え方: ブラウザは短く、ログインの前後で取り違えないよう Cookie でも分ける
    add_header Cache-Control "public, max-age=30" always;
    add_header Vary "Accept-Encoding, Cookie" always;
    add_header X-Edge "hit" always;
    try_files /current/anon$uri.json /pre_live$uri.json /api/__edge_miss$uri;   # pre_live は見張りが付け替える（current/pre か空）
}
