# /etc/nginx/snippets/keiba-api-cache.conf（サイト設定の /api/ の location の中から include される。vps_09_api_cache.sh が配置）
# 上流（ホスト／Cloud Run）に依存しないよう、キャッシュの指示だけを書く。上流の認証ヘッダは各サイト設定側にある。
#
# 安全の考え方（会員区分の混在を構造的に防ぐ）:
#   1. 保存の可否は上流の応答に任せる。proxy_cache_valid は書かない = Cache-Control: public, s-maxage/max-age が付いた応答だけ保存される。
#      アプリは「匿名 かつ 許可リスト(config/http_cache.json)」の応答にだけ public を付ける。private / no-store / Set-Cookie 付きは nginx が保存しない。
#   2. Cookie か Authorization を持つ要求は、読むのも保存するのも飛ばす（$keiba_api_nocache）。
#   3. 上流が Vary: Cookie を付けるので、nginx は Cookie の値ごとに別の保存先になる。
#   4. 事前ロード(keiba-cache-warm)だけが X-Keiba-Refresh(合言葉)つきで「読まずに取り直して保存」できる($keiba_refresh)。保存の可否は 1 と同じく上流の public 指示。
#      この見出しは上流へ渡さない（下の proxy_set_header）。かわりに X-Keiba-Fresh: 1 を付け、API 内の応答の使い回し（prerender）も読まずに
#      作り直させる（共有鍵が通った要求だけ API が受け付ける。src/api/middleware/proxy_key.py）。付けないと、Cloud Run が使い回している古い応答を長く保存してしまう。
#   5. stg と本番は同じ保存物を使う（鍵にホスト・ポートを入れない）。ただし stg は新しい API コード（rstg）を向いているので、
#      stg の要求は読むだけで保存しない（$keiba_cache_readonly。stg の待ち受けポートを vps_09 が /etc/nginx/keiba-cache-readonly.conf に書く）。
#      保存するのは本番の要求と、本番の口（127.0.0.1:8080）を叩く事前ロードだけなので、検証中のコードの応答が本番の利用者に出ることはない。
proxy_cache keiba_apicache;
proxy_cache_key $request_uri;
proxy_cache_bypass $keiba_api_nocache $keiba_refresh;
proxy_no_cache $keiba_api_nocache $keiba_cache_readonly;
proxy_set_header X-Keiba-Refresh "";
proxy_set_header X-Keiba-Fresh $keiba_refresh;
proxy_cache_lock on;
proxy_cache_lock_timeout 10s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
add_header X-Cache-Status $upstream_cache_status always;
