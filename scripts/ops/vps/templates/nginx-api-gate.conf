# /etc/nginx/conf.d/keiba-api-gate.conf（http の文脈。vps_09_api_cache.sh が毎回置き直す。使うのは API のスニペット nginx-api-cache.conf だけ）
#
# 1. Cookie も Authorization も無い要求の「会員だけの API」は、nginx が 401 を返す（Cloud Run に行かせない）。
#    一覧は src/api/tier.py の _MEMBER_ONLY_PATTERNS と同じ（tests/ops/test_nginx_api_gate.py が一致を確かめる）。
#    API はこの判定を Cookie だけで行い、匿名には 401（member_required）を返すので、答えは変わらない。本文は tier.MEMBER_REQUIRED_BODY と同じ。
#    例外: 保守中（毎日 03:00〜04:00）は、API なら 503（保守）を返していた。今後この一覧のパスは 401 になる。
#          画面は、ほかの API（公開のパス）の 503 で保守と分かる。
#    API の判定と同じく OPTIONS には掛けない。
#    匿名の 1 画面ごとに数件が Cloud Run に行っていた（2026-11-23 の計測。フロントの直しは edge-front が別に行う）。
#    キーは「$keiba_api_nocache（0 = Cookie も Authorization も無い）＋メソッド＋パス」。
map "$keiba_api_nocache$request_method$uri" $keiba_member_401 {
    default 0;
    "~^0(?!OPTIONS)[A-Z]+/api/race/[^/]+/(tracking-difficulty|bundle|bloodline-aptitude|final-odds)" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/race/[^/]+/result$" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/predictions$" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/growth-curve/(?!status)" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/race-quality/" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/v1/betting/" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/prediction-results/bets-(summary|by-level)" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/v1/races/[^/]+/(final-odds|megu-index|megu-index-predicted|tracking-difficulty|predictions/laps|running-map)" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/v1/horse/[^/]+/(megu-index-history|growth-curve)" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/v1/(pedigree-race-stats|data-analysis)/" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/v1/(bloodline-cluster/horse-aptitude|pedigree/race-note-3d-v2)" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/v1/races/[^/]+/analysis$" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/data/" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/horse/" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/betting/pair-odds/" 1;
    "~^0(?!OPTIONS)[A-Z]+/api/odds/" 1;
}
#
# 2. 保守の状態は Cloud Run ごとの臨時メンテ（override）で変わりうるので、stg（読むだけのポート）は本番の保存物を読まない（鍵を別にする）。
#    stg は保存しないので、stg の保守の状態は毎回 stg の Cloud Run に聞く。ほかのパスの鍵は今までどおり $request_uri だけ（保存物はそのまま使える）。
map "$keiba_cache_readonly$uri" $keiba_cache_key_prefix {
    default "";
    "~^1/api/(v1/)?maintenance/status$" "stg:";
}
