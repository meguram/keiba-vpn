# /etc/nginx/snippets/keiba-img-cache.conf（サイト設定の server 内、API の location より前に include する）
# /data/image/ はホストの静的な画像（会員区分に依存しない）。毎回ホストへ取りに行かず、VPS で 7 日までキャッシュする。
# Set-Cookie 付きの応答は nginx が自動でキャッシュしない。API（/api/）は共有キャッシュにしない（会員区分で内容が変わるため）。
location ~ ^/data/image/ {
    limit_req zone=keiba_api burst=60 nodelay;
    proxy_cache keiba_img;
    proxy_cache_key $uri$is_args$args;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_pass https://$upstream_host$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name $upstream_host;
    proxy_set_header Host $upstream_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Keiba-Client-IP $remote_addr;
    include /etc/nginx/keiba-access.conf;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    add_header X-Cache-Status $upstream_cache_status always;
}
