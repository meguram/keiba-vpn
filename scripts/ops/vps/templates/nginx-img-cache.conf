# /etc/nginx/snippets/keiba-img-cache.conf（サイト設定の『画像の location』の中で include する。vps_04_image_cache.sh が配置）
# /data/image/ は静的な画像（会員区分に依存しない）。毎回上流へ取りに行かず、VPS で 7 日までキャッシュする。
# 上流の認証ヘッダ（ホスト: keiba-access.conf / Cloud Run: keiba-proxykey.conf）は location 側にあるので、ここには書かない。
# Set-Cookie 付きの応答は nginx が自動でキャッシュしない。画像を差し替えたら purge_img_cache.sh で空にする。
proxy_cache keiba_img;
proxy_cache_key $uri$is_args$args;
proxy_cache_valid 200 7d;
proxy_cache_valid 404 1m;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_lock on;
add_header X-Cache-Status $upstream_cache_status always;
