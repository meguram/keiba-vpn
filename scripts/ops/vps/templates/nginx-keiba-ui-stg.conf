# stg 環境の画面用の nginx（/etc/nginx/sites-available/keiba-ui-stg）。vps_05_stg_instance.sh が __NAME__ を置換して配置する。
# 本番の nginx-keiba-ui-cloudrun.conf と同じ作りで、違いは次の 3 つだけ:
#   ポート   : nginx 127.0.0.1:__PROXY_PORT__（既定 8081）→ 画面 Next.js 127.0.0.1:__APP_PORT__（既定 3002）
#   API の上流: Cloud Run の『stg のタグ付きリビジョン』（rstg---keiba-api-….run.app。通信 0% でも、このタグ URL には届く）
#   共有鍵   : 本番と同じ Cloud Run サービスなので、同じ X-Keiba-Proxy-Key（/etc/nginx/keiba-proxykey.conf）を使う
# cloudflared（stg.megu-keiba.com）→ この nginx → ページは Next.js(stg)、/api は Cloud Run(rstg)
server {
    listen 127.0.0.1:__PROXY_PORT__;
    server_name _;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;
    server_tokens off;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $upstream_host __CLOUDRUN_HOST__;

    location ~ ^/api/ {
        limit_req zone=keiba_api burst=60 nodelay;
        proxy_pass https://$upstream_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream_host;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # ブラウザが送ってきた値は使わず、nginx が見た実クライアント IP だけを渡す（Cloud Run 側は鍵が通った要求にだけ採用）
        proxy_set_header X-Keiba-Client-IP $remote_addr;
        include /etc/nginx/keiba-proxykey.conf;   # X-Keiba-Proxy-Key（render_nginx_proxykey.sh が作る。640 root:www-data）
        proxy_redirect ~^https://__CLOUDRUN_HOST_RE__(.*)$ $1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 70s;       # Cloud Run のリクエスト上限 60 秒 + 余裕
        proxy_buffering on;
        include /etc/nginx/snippets/keiba-api-cache*.conf;   # 未配置なら何も読まない（vps_09_api_cache.sh で配置）
    }

    # 画像は会員区分で変わらない静的ファイル。上流の種類（ホスト/Cloud Run）はこの location の認証ヘッダがそのまま引き継ぐ
    location ~ ^/data/image/ {
        limit_req zone=keiba_api burst=60 nodelay;
        proxy_pass https://$upstream_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream_host;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # ブラウザが送ってきた値は使わず、nginx が見た実クライアント IP だけを渡す（Cloud Run 側は鍵が通った要求にだけ採用）
        proxy_set_header X-Keiba-Client-IP $remote_addr;
        include /etc/nginx/keiba-proxykey.conf;   # X-Keiba-Proxy-Key（render_nginx_proxykey.sh が作る。640 root:www-data）
        proxy_redirect ~^https://__CLOUDRUN_HOST_RE__(.*)$ $1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        include /etc/nginx/snippets/keiba-img-cache*.conf;   # 未配置なら何も読まない（vps_04_image_cache.sh で配置）
    }

    location / {
        limit_req zone=keiba_page burst=120 nodelay;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
