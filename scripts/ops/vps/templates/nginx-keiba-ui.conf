# /etc/nginx/sites-available/keiba-ui（vps_02 が __NAME__ を vars.env の値に置換して配置）
# cloudflared（127.0.0.1）→ この nginx(:__PROXY_PORT__) → ページ: Next.js(:__APP_PORT__) / API: ホスト機の __UPSTREAM_HOST__（Access の Service Auth）
server {
    listen 127.0.0.1:__PROXY_PORT__;
    server_name _;

    # Cloudflare 経由の実クライアント IP（cloudflared はループバックから来る）
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;
    server_tokens off;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $upstream_host __UPSTREAM_HOST__;

    # API・画像は上流（ホスト機。stg の Next.js が /api/v1 → Flask、/api → FastAPI に振り分ける）へ。
    # Access のサービストークンはここ（VPS のサーバー側）だけに持ち、ブラウザには出さない。
    location ~ ^/(api/|data/image/) {
        limit_req zone=keiba_api burst=60 nodelay;
        proxy_pass https://$upstream_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream_host;
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # 上流の anti_scraping が本当のクライアント IP を使えるように（上流は edge_sources に VPS の IP を載せたときだけ採用）
        proxy_set_header X-Keiba-Client-IP $remote_addr;
        include /etc/nginx/keiba-access.conf;   # CF-Access-Client-Id / CF-Access-Client-Secret（render_nginx_access.sh が作る）
        proxy_redirect ~^https://__UPSTREAM_HOST_RE__(.*)$ $1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_buffering on;
    }

    # ページと静的ファイルは VPS の Next.js
    location / {
        limit_req zone=keiba_page burst=120 nodelay;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
